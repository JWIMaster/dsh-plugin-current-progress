# Bundle patch: inserts the current-progress Host plugin into the profile.
# Every value below is optional; the plugin falls back to the same defaults.
- insert:
    - id: current-progress
      name: 'dsh-plugin-current-progress'
      config:
        # Name of the progress file inside each session's working directory.
        fileName: CURRENT_PROGRESS.md
        # Ask the user at session start when the file does not exist yet.
        ask: true
        # How long a single question waits for an answer before giving up.
        askTimeoutMs: 120000
        # Retry schedule (ms) while no interactive answerer is attached yet
        # (a browser client registers its answerer shortly after a session
        # becomes visible).
        askAttemptsMs: [0, 300, 900, 2000, 4500, 9000]
        # Contribute an existing file to the new session's context.
        injectExisting: true
        # Append one entry per finished turn.
        recordTurns: true
        # Retention: the newest turns win. Three is deliberate — an existing
        # file is injected into the next session's context in full, so turns
        # older than that cost context without changing what it does next.
        maxEntries: 3
        maxFileBytes: 16384
        # Context/entry size limits. An entry is a handover note, so the closing
        # summary gets the most room; the work lines and the failure reasons are
        # labels, and the reads are collapsed.
        maxReadBytes: 12288
        maxAskChars: 400
        maxResultChars: 700
        maxChanges: 8
        maxFailures: 4
        maxScanned: 5
        maxToolDetailChars: 72
        maxFailureChars: 72
        # Diagnostics (off by default): set this to a file path to append one
        # line per decision — attach, startup outcome, provider participation,
        # turn boundary, write result. Useful when a turn produces no entry.
        # traceFile: /Users/jwalr/.dsh/plugins/current-progress/trace.log
